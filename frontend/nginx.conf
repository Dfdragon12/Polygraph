server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mismo prefijo relativo (/api/v1) que usa axios en src/services/api.js — el frontend no
    # necesita saber la URL real del backend en tiempo de build, solo que "backend" es el nombre
    # del servicio en docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA — cualquier ruta que no sea un archivo real cae a index.html para que React Router
    # decida qué mostrar (sin esto, refrescar la página en /admin/clientes daría 404 de nginx
    # en vez de dejar que la app cargue esa ruta).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
