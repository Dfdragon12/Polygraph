# PC-08 · nginx de producción: sirve los archivos compilados (npm run build) y reenvía /api al backend.
# El HTTPS NO se termina aquí: lo hace el proxy de borde (Caddy en docker-compose.prod.yml, ver README «HTTPS y dominio»); este nginx habla HTTP dentro de la red de Docker.

# Los archivos de JS/CSS/JSON/SVG viajan comprimidos (el paquete principal baja de ~390 KB a ~120 KB).
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

# Qué protocolo usó el visitante: lo dice el proxy de borde (https); si se entra directo a este nginx, el propio.
map $http_x_forwarded_proto $proto_visitante {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los documentos que sube el candidato o el cliente pesan hasta 10 MB (spring.servlet.multipart.max-file-size); el tope por defecto de nginx es 1 MB y respondería 413.
    client_max_body_size 12m;

    # Cabeceras de seguridad básicas para todo lo que sirve este nginx.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Avisos en tiempo real (Server-Sent Events): conexión larga que NO se debe guardar en búfer ni cortar al minuto (el latido del servidor es cada 25 s).
    location ~ ^/api/v1/(tiempo-real/eventos|evaluees/link/[^/]+/eventos)$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_visitante;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Mismo prefijo relativo (/api/v1) que usa axios en src/services/api.js — el frontend no necesita saber la URL real del backend en tiempo de build, solo que "backend" es el
    # nombre del servicio en docker-compose.yml. X-Forwarded-Proto lo manda el proxy de borde (https) para que el backend arme bien los enlaces.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_visitante;
        proxy_read_timeout 120s;
    }

    # Los pedazos de la app llevan el hash en el nombre (assets/Dashboard-AbC123.js): nunca cambian, el navegador los guarda un año.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # El HTML y el service worker NO se guardan: así cada versión nueva se entera de sus pedazos nuevos al recargar.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA — cualquier ruta que no sea un archivo real cae a index.html para que React Router decida qué mostrar (sin esto, refrescar la página en /admin/clientes daría 404 de nginx
    # en vez de dejar que la app cargue esa ruta).
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
