<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recordatorio - Polygraph Service</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f5f9;font-family:Arial,Helvetica,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 0;">
  <tr>
    <td align="center">
      <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,0.08);">
        <tr>
          <td style="background:#dc2626;padding:28px 40px;text-align:center;">
            <h1 style="color:#ffffff;margin:0;font-size:24px;font-weight:bold;">Polygraph Service</h1>
          </td>
        </tr>
        <tr>
          <td style="padding:36px 40px 24px;">
            <h2 style="color:#1e293b;margin:0 0 12px;font-size:20px;">Hola, {{nombre}}</h2>
            <p style="color:#475569;line-height:1.7;margin:0 0 20px;font-size:15px;">
              Te recordamos que tu enlace para el proceso de <strong>{{proceso}}</strong> sigue activo. Puedes continuar donde lo dejaste:
              para entrar, escribe tu n&uacute;mero de c&eacute;dula.
            </p>
            <div style="text-align:center;margin:28px 0;">
              <a href="{{enlace}}" style="display:inline-block;background:#dc2626;color:#ffffff;text-decoration:none;font-weight:bold;font-size:16px;padding:15px 36px;border-radius:8px;">
                Continuar mi informaci&oacute;n
              </a>
            </div>
            <p style="color:#94a3b8;font-size:13px;line-height:1.6;margin:0;word-break:break-all;">Si el bot&oacute;n no funciona, copia este enlace en tu navegador: {{enlace}}</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
