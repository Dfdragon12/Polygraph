spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/erp_polygraph
    username: erp_user
    password: erp_pass

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:dev_user}
    password: ${MAIL_PASS:dev_pass}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  jwt:
    secret: dev-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  # Ruta típica del instalador oficial de LibreOffice en Windows de 64 bits — si lo instalaste en
  # otra carpeta, ajusta esto (o define la variable de entorno LIBREOFFICE_BINARIO, que tiene
  # prioridad sobre este archivo).
  libreoffice:
    binario: 'C:\Program Files\LibreOffice\program\soffice.exe'
  cors:
    allowed-origins: http://localhost:5173,https://rhyme-pastrami-common.ngrok-free.dev
  frontend:
    url: http://localhost:5173

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.polygraph.erp: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG