spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/erp_polygraph
    username: erp_user
    password: erp_pass

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.mailtrap.io
    port: 587
    username: dev_user
    password: dev_pass

app:
  jwt:
    secret: dev-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  cors:
    allowed-origins: http://localhost:5173
  frontend:
    url: http://localhost:5173

logging:
  level:
    com.polygraph.erp: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
