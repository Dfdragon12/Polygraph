server:
  port: 8080

spring:
  # Carga backend/.env si existe (mismo formato que .properties: CLAVE=valor). "optional:" evita
  # que falle el arranque cuando el archivo no está — así también funciona en Docker/CI, donde
  # las variables llegan directo del entorno del contenedor.
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: erp-polygraph

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  storage:
    uploads-dir: ${UPLOADS_DIR:./uploads}
  # Conversión de plantillas Word a PDF (ver DocumentoPdfConverter) — "soffice" a secas asume que
  # LibreOffice quedó en el PATH del sistema, que es como queda en producción (backend/Dockerfile
  # ya lo instala así). En Windows local normalmente NO queda en el PATH — application-dev.yml
  # sobreescribe esto con la ruta completa al ejecutable.
  libreoffice:
    binario: ${LIBREOFFICE_BINARIO:soffice}
    timeout-segundos: ${LIBREOFFICE_TIMEOUT_SEGUNDOS:60}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  link-evaluado:
    expiracion-horas: 36
  mensajes:
    retencion-dias: ${MENSAJES_RETENCION_DIAS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}

  admin:
      email: ${ADMIN_EMAIL:admin@polygraph.com}                                                                    
      password: ${ADMIN_PASSWORD:Admin1234!}                                                                       
      nombre: ${ADMIN_NOMBRE:Administrador} 
google:
  oauth:
    # Client ID de la app OAuth en Google Cloud Console — vacío hasta que se configure una.
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}

wompi:
  public-key: ${WOMPI_PUBLIC_KEY}
  private-key: ${WOMPI_PRIVATE_KEY}
  integrity-secret: ${WOMPI_INTEGRITY_SECRET}
  events-secret: ${WOMPI_EVENTS_SECRET}
  base-url: ${WOMPI_BASE_URL}
  redirect-url: ${WOMPI_REDIRECT_URL}
  checkout-url: ${WOMPI_CHECKOUT_URL:https://checkout.wompi.co/p/}

springdoc:
  # Apagado por defecto — sin esto, cualquiera sin login veía toda la estructura de la API
  # (rutas, DTOs) en producción, porque SecurityConfig deja estas rutas en permitAll() para que
  # Swagger UI funcione en desarrollo sin pedir token. application-dev.yml lo prende localmente;
  # en producción hay que setear SWAGGER_ENABLED=true a propósito si de verdad se necesita.
  api-docs:
    path: /api/v1/api-docs
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /api/v1/swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}
