server:
  port: 8080

spring:
  # Carga backend/.env si existe (mismo formato que .properties: CLAVE=valor). "optional:" evita
  # que falle el arranque cuando el archivo no está — así también funciona en Docker/CI, donde
  # las variables llegan directo del entorno del contenedor.
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: erp-polygraph

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  storage:
    uploads-dir: ${UPLOADS_DIR:./uploads}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  link-evaluado:
    expiracion-horas: 36
  mensajes:
    retencion-dias: ${MENSAJES_RETENCION_DIAS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}

  wompi:
    public-key: ${WOMPI_PUBLIC_KEY:}
    integrity-secret: ${WOMPI_INTEGRITY_SECRET:}
    events-secret: ${WOMPI_EVENTS_SECRET:}
    checkout-url: ${WOMPI_CHECKOUT_URL:https://checkout.wompi.co/p/}

  admin:
      email: ${ADMIN_EMAIL:admin@polygraph.com}                                                                    
      password: ${ADMIN_PASSWORD:Admin1234!}                                                                       
      nombre: ${ADMIN_NOMBRE:Administrador} 
wompi:
  public-key: ${WOMPI_PUBLIC_KEY}
  private-key: ${WOMPI_PRIVATE_KEY}
  integrity-secret: ${WOMPI_INTEGRITY_SECRET}
  events-secret: ${WOMPI_EVENTS_SECRET}
  base-url: ${WOMPI_BASE_URL}
  redirect-url: ${WOMPI_REDIRECT_URL}

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/swagger-ui.html
    enabled: true
