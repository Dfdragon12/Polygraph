spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 25
    username: test
    password: test

app:
  # H2 no tiene FOR UPDATE SKIP LOCKED: en pruebas no corre el despachador de la cola.
  trabajos:
    habilitado: false
    directorio: ./target/trabajos-test
  jwt:
    secret: test-secret-key-for-unit-tests-minimum-256-bits-long-pad-to-32-chars
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  frontend:
    url: http://localhost:5173
  admin:
    email: admin@polygraph.com
    password: Admin1234!
    nombre: Administrador
