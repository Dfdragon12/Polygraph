version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: polygraph_postgres
    environment:
      POSTGRES_DB: erp_polygraph
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_pass
    ports:
      - "5432:5432"
    volumes:
      - polygraph_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: polygraph_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  polygraph_data: