version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: polygraph_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-erp_polygraph}
      POSTGRES_USER: ${DB_USER:-erp_user}
      POSTGRES_PASSWORD: ${DB_PASS:-erp_pass}
    ports:
      - "5432:5432"
    volumes:
      - polygraph_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: polygraph_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # Toma todas las variables (DB_*, JWT_SECRET, MAIL_*, WOMPI_*, CORS_ALLOWED_ORIGINS,
  # FRONTEND_URL, etc.) del .env en la raíz del repo — ver .env.example para la lista completa.
  # Ninguna tiene default inseguro en application.yml: si falta alguna obligatoria, el backend
  # no arranca (falla rápido, no falla "abierto").
  backend:
    build: ./backend
    container_name: polygraph_backend
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "8080:8080"
    volumes:
      # Persiste backend/uploads (documentos legales de clientes + plantillas Word de
      # formularios) fuera del contenedor — sin esto, se pierde todo cada vez que el
      # contenedor se recrea (deploy, reinicio, escalado).
      - polygraph_uploads:/app/uploads
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: polygraph_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  polygraph_data:
  polygraph_uploads: